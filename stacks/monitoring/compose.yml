services:
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.56
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
